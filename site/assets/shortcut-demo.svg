<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="t d"><title id="t">Keyboard shortcuts visual guide</title><desc id="d">A keyboard with Ctrl modifier and numeric keypad keys one through seven, plus Next and Previous actions.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22345c"/><stop offset="1" stop-color="#111827"/></linearGradient></defs><rect width="900" height="430" rx="26" fill="url(#g)" stroke="#394b70"/><text x="42" y="54" fill="#f2f5ff" font-family="Inter,Segoe UI,Arial" font-size="22" font-weight="700">Your shortcuts, your layout</text><text x="42" y="82" fill="#a4b3d2" font-family="Inter,Segoe UI,Arial" font-size="14">Every action can use a different key combination.</text><g font-family="Inter,Segoe UI,Arial" font-weight="700" text-anchor="middle"><rect x="42" y="125" width="130" height="80" rx="13" fill="#2a3c65" stroke="#617ab3"/><text x="107" y="173" fill="#eef2ff" font-size="22">CTRL</text><g fill="#202c44" stroke="#475a7d"><rect x="192" y="125" width="76" height="80" rx="12"/><rect x="280" y="125" width="76" height="80" rx="12"/><rect x="368" y="125" width="76" height="80" rx="12"/><rect x="456" y="125" width="76" height="80" rx="12"/><rect x="544" y="125" width="76" height="80" rx="12"/><rect x="632" y="125" width="76" height="80" rx="12"/><rect x="720" y="125" width="76" height="80" rx="12"/></g><g fill="#dfe8ff" font-size="28"><text x="230" y="174">1</text><text x="318" y="174">2</text><text x="406" y="174">3</text><text x="494" y="174">4</text><text x="582" y="174">5</text><text x="670" y="174">6</text><text x="758" y="174">7</text></g><g fill="#8ea1ca" font-size="12" font-weight="500"><text x="230" y="227">PAGE 1</text><text x="318" y="227">PAGE 2</text><text x="406" y="227">PAGE 3</text><text x="494" y="227">PAGE 4</text><text x="582" y="227">PAGE 5</text><text x="670" y="227">PAGE 6</text><text x="758" y="227">PAGE 7</text></g></g><path d="M45 268H855" stroke="#344563"/><g font-family="Inter,Segoe UI,Arial"><rect x="42" y="294" width="382" height="90" rx="14" fill="#17243a" stroke="#38517c"/><text x="66" y="328" fill="#f0f4ff" font-size="16" font-weight="700">Next page</text><text x="66" y="353" fill="#9eafce" font-size="13">Move forward through enabled pages</text><rect x="311" y="313" width="84" height="44" rx="8" fill="#2b3a58"/><text x="353" y="341" text-anchor="middle" fill="#f0f4ff" font-size="14">CTRL +</text><rect x="443" y="294" width="412" height="90" rx="14" fill="#17243a" stroke="#38517c"/><text x="467" y="328" fill="#f0f4ff" font-size="16" font-weight="700">Previous page</text><text x="467" y="353" fill="#9eafce" font-size="13">Move back and wrap at the beginning</text><rect x="746" y="313" width="84" height="44" rx="8" fill="#2b3a58"/><text x="788" y="341" text-anchor="middle" fill="#f0f4ff" font-size="14">CTRL −</text></g></svg>
