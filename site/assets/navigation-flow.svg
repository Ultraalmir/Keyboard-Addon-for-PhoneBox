<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="t d"><title id="t">How PhoneBox Keyboard Add-on works</title><desc id="d">Keyboard shortcut is detected by the Windows add-on, sent to the local PhoneBox agent API, and navigates the Android PhoneBox panel.</desc><defs><linearGradient id="p" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1c2d50"/><stop offset="1" stop-color="#121a2a"/></linearGradient></defs><rect width="1000" height="260" rx="22" fill="#0d1421" stroke="#293b5c"/><g font-family="Inter,Segoe UI,Arial" text-anchor="middle"><rect x="32" y="57" width="250" height="146" rx="17" fill="url(#p)" stroke="#48618c"/><text x="157" y="101" fill="#8fa7ff" font-size="13" font-weight="700">01 · INPUT</text><text x="157" y="137" fill="#f2f5ff" font-size="21" font-weight="700">Your keyboard</text><text x="157" y="166" fill="#a3b2ce" font-size="13">Global hotkey detected</text><path d="M299 130h55m-10-9 10 9-10 9" stroke="#7c93ce" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="374" y="57" width="250" height="146" rx="17" fill="url(#p)" stroke="#48618c"/><text x="499" y="101" fill="#65d9c3" font-size="13" font-weight="700">02 · ROUTE</text><text x="499" y="137" fill="#f2f5ff" font-size="21" font-weight="700">Windows add-on</text><text x="499" y="166" fill="#a3b2ce" font-size="13">Local PhoneBox API request</text><path d="M641 130h55m-10-9 10 9-10 9" stroke="#7c93ce" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="716" y="57" width="250" height="146" rx="17" fill="url(#p)" stroke="#48618c"/><text x="841" y="101" fill="#a78bfa" font-size="13" font-weight="700">03 · RESULT</text><text x="841" y="137" fill="#f2f5ff" font-size="21" font-weight="700">PhoneBox panel</text><text x="841" y="166" fill="#a3b2ce" font-size="13">Page changes on your phone</text></g></svg>
