<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="900" viewBox="0 0 1320 900" role="img" aria-labelledby="title desc">
<title id="title">PhoneBox Keyboard Add-on settings panel preview</title><desc id="desc">Dark settings dashboard with keyboard shortcuts, relative navigation, preferences and add-on status.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18233f"/><stop offset="1" stop-color="#0b0f19"/></linearGradient>
 <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#24345d"/><stop offset="1" stop-color="#1a2036"/></linearGradient>
 <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#91a6ff"/><stop offset="1" stop-color="#6cdbd1"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".3"/></filter>
</defs>
<rect width="1320" height="900" rx="32" fill="#080b12"/>
<rect x="12" y="12" width="1296" height="876" rx="25" fill="url(#bg)" stroke="#34415f" stroke-width="2"/>
