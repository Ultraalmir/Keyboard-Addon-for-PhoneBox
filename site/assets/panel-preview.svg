<text x="126" y="116" fill="#f4f6ff" font-family="Inter,Segoe UI,Arial" font-size="25" font-weight="700">PhoneBox Keyboard Add-on</text>
<text x="126" y="142" fill="#8796b6" font-family="Inter,Segoe UI,Arial" font-size="14">Global shortcuts · Windows 11 / 10 LTSC (supported)</text>
<rect x="1037" y="100" width="225" height="40" rx="20" fill="#143728" stroke="#285f49"/>
<circle cx="1060" cy="120" r="5" fill="#5fe0a5"/><text x="1080" y="125" fill="#7fe7b7" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="700">RUNNING IN BACKGROUND</text>
<rect x="52" y="177" width="1210" height="112" rx="20" fill="url(#hero)" stroke="#43557e"/>
<text x="80" y="218" fill="#f7f8ff" font-family="Inter,Segoe UI,Arial" font-size="27" font-weight="700">Navigate PhoneBox with your keyboard</text>
<text x="80" y="248" fill="#bdc9e5" font-family="Inter,Segoe UI,Arial" font-size="16">Configure up to 10 direct page shortcuts, plus Next and Previous.</text>
<text x="80" y="271" fill="#91a4ca" font-family="Inter,Segoe UI,Arial" font-size="13">Choose your own combinations · Toggle actions individually · Save locally</text>
<text x="1084" y="226" fill="#dce5ff" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" text-anchor="middle">SHORTCUTS ON</text>
<rect x="1166" y="207" width="58" height="30" rx="15" fill="#5ad7a0"/><circle cx="1208" cy="222" r="11" fill="#fff"/>
