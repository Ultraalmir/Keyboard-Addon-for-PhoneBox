<text x="96" y="766" fill="#9caccc" font-family="Inter,Segoe UI,Arial" font-size="12">Next page  ·  Previous page  ·  Works beyond 10 pages</text>
<rect x="556" y="729" width="94" height="31" rx="7" fill="#293550"/><text x="603" y="749" fill="#e5ecff" font-family="Inter,Segoe UI,Arial" font-size="12" text-anchor="middle">CTRL +</text>
<rect x="658" y="729" width="94" height="31" rx="7" fill="#293550"/><text x="705" y="749" fill="#e5ecff" font-family="Inter,Segoe UI,Arial" font-size="12" text-anchor="middle">CTRL −</text>
<!-- right column -->
<rect x="828" y="316" width="434" height="252" rx="20" fill="#111927" stroke="#2d3b55"/>
<text x="856" y="359" fill="#f3f5ff" font-family="Inter,Segoe UI,Arial" font-size="20" font-weight="700">Preferences</text>
<text x="856" y="384" fill="#91a0bb" font-family="Inter,Segoe UI,Arial" font-size="13">Choose how the add-on behaves.</text>
