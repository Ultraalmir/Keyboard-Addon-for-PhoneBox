<rect x="52" y="316" width="754" height="520" rx="20" fill="#111927" stroke="#2d3b55"/>
<text x="80" y="359" fill="#f3f5ff" font-family="Inter,Segoe UI,Arial" font-size="20" font-weight="700">Direct page shortcuts</text>
<text x="80" y="384" fill="#91a0bb" font-family="Inter,Segoe UI,Arial" font-size="13">Set a keyboard combination for each page position.</text>
