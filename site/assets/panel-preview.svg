<circle cx="43" cy="38" r="7" fill="#ff737d"/><circle cx="67" cy="38" r="7" fill="#f2c56c"/><circle cx="91" cy="38" r="7" fill="#62d9a5"/>
<text x="660" y="44" fill="#8390aa" font-family="Inter,Segoe UI,Arial" font-size="15" text-anchor="middle">PhoneBox Keyboard Add-on · Local settings</text>
