name: Relatar um problema
description: Informe uma falha no complemento.
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Versão do complemento
      placeholder: 1.5.3
    validations:
      required: true
  - type: input
    id: phonebox
    attributes:
      label: Versão do PhoneBox
    validations:
      required: true
  - type: textarea
    id: windows
    attributes:
      label: Versão do Windows e arquitetura
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Trecho relevante do log (remova dados privados)
      render: text
