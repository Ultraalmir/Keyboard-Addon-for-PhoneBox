name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/PhoneBoxKeyboardAddon/PhoneBoxKeyboardAddon.csproj

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $scriptFiles = @(Get-ChildItem scripts -Filter *.ps1 -File) + @(Get-Item src/PhoneBoxKeyboardAddon/UpdateHelper.ps1)
          foreach ($scriptFile in $scriptFiles) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($scriptFile.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error "$($scriptFile.Name): $($_.Message) at $($_.Extent.StartLineNumber):$($_.Extent.StartColumnNumber)" }
            }
          }

      - name: Build and self-test
        shell: pwsh
        run: |
          dotnet build src/PhoneBoxKeyboardAddon/PhoneBoxKeyboardAddon.csproj --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }
          dotnet run --project src/PhoneBoxKeyboardAddon/PhoneBoxKeyboardAddon.csproj --configuration Release --no-build -- --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Self-test failed.' }

      - name: Publish
        run: dotnet publish src/PhoneBoxKeyboardAddon/PhoneBoxKeyboardAddon.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output artifacts/publish

      - name: Package and checksum
        shell: pwsh
        run: |
          $package = 'artifacts/package'
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Copy-Item artifacts/publish/PhoneBoxKeyboardAddon.exe $package
          Copy-Item -Path README.md, LICENSE, scripts/install.ps1, scripts/uninstall.ps1 -Destination $package
          Compress-Archive -Path "$package/*" -DestinationPath artifacts/PhoneBoxKeyboardAddon-win-x64.zip -CompressionLevel Optimal
          $hash = (Get-FileHash artifacts/PhoneBoxKeyboardAddon-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  PhoneBoxKeyboardAddon-win-x64.zip" | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" artifacts/PhoneBoxKeyboardAddon-win-x64.zip artifacts/SHA256SUMS.txt --title "PhoneBox Keyboard Add-on ${{ github.ref_name }}" --generate-notes
