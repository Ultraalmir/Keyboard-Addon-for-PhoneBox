name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Validate release version, tag and changelog
        shell: pwsh
        run: .\scripts\validate-version.ps1 -ExpectedVersion $env:GITHUB_REF_NAME -RequireDatedChangelog

      - name: Validate PowerShell syntax
        shell: pwsh
        run: .\scripts\validate-powershell.ps1

      - name: Build and run self-tests, including settings launcher
        shell: pwsh
        run: .\scripts\publish-windows.ps1

      - name: Assemble package and checksum manifest
        shell: pwsh
        run: .\scripts\package.ps1

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" artifacts/PhoneBoxKeyboardAddon-win-x64.zip artifacts/SHA256SUMS.txt --verify-tag --title "PhoneBox Keyboard Add-on ${{ github.ref_name }}" --generate-notes
