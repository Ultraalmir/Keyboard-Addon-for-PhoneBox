name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/PhoneBoxKeyboardAddon/PhoneBoxKeyboardAddon.csproj

      - name: Build
        run: dotnet build src/PhoneBoxKeyboardAddon/PhoneBoxKeyboardAddon.csproj --configuration Release --no-restore

      - name: Run built-in self-tests
        run: dotnet run --project src/PhoneBoxKeyboardAddon/PhoneBoxKeyboardAddon.csproj --configuration Release --no-build -- --self-test

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $scriptFiles = Get-ChildItem scripts -Filter *.ps1 -File
          foreach ($scriptFile in $scriptFiles) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($scriptFile.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error "$($scriptFile.Name): $($_.Message) at $($_.Extent.StartLineNumber):$($_.Extent.StartColumnNumber)" }
            }
          }

      - name: Publish self-contained Windows x64
        run: dotnet publish src/PhoneBoxKeyboardAddon/PhoneBoxKeyboardAddon.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output artifacts/publish

      - name: Assemble release package
        shell: pwsh
        run: |
          $package = 'artifacts/package'
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Copy-Item artifacts/publish/PhoneBoxKeyboardAddon.exe $package
          Copy-Item -Path README.md, LICENSE, scripts/install.ps1, scripts/uninstall.ps1 -Destination $package
          Compress-Archive -Path "$package/*" -DestinationPath artifacts/PhoneBoxKeyboardAddon-win-x64.zip -CompressionLevel Optimal
          "$((Get-FileHash artifacts/PhoneBoxKeyboardAddon-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant())  PhoneBoxKeyboardAddon-win-x64.zip" | Set-Content artifacts/PhoneBoxKeyboardAddon-win-x64.zip.sha256 -Encoding ascii

      - name: Upload package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: PhoneBoxKeyboardAddon-win-x64
          path: |
            artifacts/PhoneBoxKeyboardAddon-win-x64.zip
            artifacts/PhoneBoxKeyboardAddon-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 21
