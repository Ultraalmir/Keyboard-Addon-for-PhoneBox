name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Validate source version metadata
        shell: pwsh
        run: .\scripts\validate-version.ps1

      - name: Validate PowerShell syntax
        shell: pwsh
        run: .\scripts\validate-powershell.ps1

      - name: Build and run self-tests, including settings launcher
        shell: pwsh
        run: .\scripts\publish-windows.ps1

      - name: Assemble package and checksum manifest
        shell: pwsh
        run: .\scripts\package.ps1

      - name: Upload package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: PhoneBoxKeyboardAddon-win-x64
          path: |
            artifacts/PhoneBoxKeyboardAddon-win-x64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 21
